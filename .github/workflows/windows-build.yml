name: GRAY ZONE CPU Debug and Release validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU and headless window prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libx11-dev xvfb xauth libsdl2-2.0-0
      - name: Configure CPU fallback
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON -DGZ_ENABLE_VULKAN=OFF -DGZ_REQUIRE_VULKAN=OFF
      - name: Build
        run: cmake --build build-linux --parallel 4
      - name: Run regression tests and X11 startup
        run: ctest --test-dir build-linux --output-on-failure --no-tests=error --parallel 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-cpu-${{ matrix.configuration }}-test-log
          path: build-linux/Testing/Temporary/LastTest.log
  windows-x64-cpu:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      # This validates CPU fallback. Native Vulkan needs its own SDK/driver run.
      - name: Configure Visual Studio x64 CPU fallback
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DGZ_ENABLE_VULKAN=OFF -DGZ_REQUIRE_VULKAN=OFF
      - name: Build
        run: cmake --build build-win --config ${{ matrix.configuration }} --parallel 4
      - name: Run regression tests
        run: ctest --test-dir build-win -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --parallel 4
      - name: Package all assets and CPU executable
        shell: pwsh
        run: ./scripts/package_windows.ps1 -BuildDir build-win -DistDir dist-win-cpu -Mode 'CPU fallback' -Configuration '${{ matrix.configuration }}'
      - name: Verify assets and run the packaged game
        shell: pwsh
        run: ./scripts/verify_windows_package.ps1 -DistDir dist-win-cpu
      - uses: actions/upload-artifact@v4
        with:
          name: GRAY_ZONE_1989_Windows_CPU_${{ matrix.configuration }}
          path: dist-win-cpu/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cpu-${{ matrix.configuration }}-test-logs
          path: |
            build-win/Testing/Temporary/LastTest.log
            dist-win-cpu/smoke_test.log
            dist-win-cpu/graphics_backend.log
